    <!-- Inline so the page pulls in nothing external and asks for no favicon.ico. -->

  </head>
  <!--
    `data-pane` opens on "docked", not the remembered default of "collapsed":
    xterm measures cell geometry at `open()`, and a `display:none` box (which
    is what `collapsed` is) gives it nothing to measure. `App.vue` mounts the
    terminal into this laid-out box first and only then calls `bootPane()`
    (from `onMounted`, so it runs after the child terminal's own `onMounted`)
    to apply whatever mode storage actually holds — matching `public/index.html`'s
    own order (`app.js`'s `mountTerminal()` before its `mountPane()`). Setting
    this attribute to "collapsed" "fixes" the boot state for a reader who
    left the pane collapsed, but breaks it for everyone else, permanently,
    by opening xterm into a box with no layout.
  -->
  <body data-pane="docked">
    <div id="app"></div>
    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
  </body>
</html>
