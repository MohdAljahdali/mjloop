<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>mjloop</title>
    <!-- Inline so the page pulls in nothing external and asks for no favicon.ico. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%2358a6ff' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="vendor/xterm.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="css/10-layout.css" />
    <link rel="stylesheet" href="css/20-rail.css" />
    <link rel="stylesheet" href="css/30-tabs.css" />
    <link rel="stylesheet" href="css/40-terminal.css" />
    <link rel="stylesheet" href="css/50-controls.css" />
    <link rel="stylesheet" href="css/60-panels.css" />
  </head>
  <body data-pane="docked">
    <header class="top">
      <div class="brand">
        <h1 data-i18n="app.title">mjloop</h1>
        <span class="project" id="project"></span>
        <label class="lang">
          <span data-i18n="lang.label">Language</span>
          <select id="lang" name="lang"></select>
        </label>
      </div>

      <!-- Page-level, above everything, and never inside a reconciled
           container: `config_error` is a total outage and must not read at the
           weight of a normal row. -->
      <div class="banners" role="status" aria-live="polite">
        <p class="banner offline" data-rail="offlineBanner" hidden data-i18n="app.disconnected"></p>
        <p class="banner error" data-rail="configBanner" hidden>
          <strong data-i18n="banner.configError"></strong>
          <code data-rail="configError"></code>
        </p>
        <p class="banner warn" data-rail="staleBanner" hidden data-i18n="banner.stale"></p>
        <p class="banner note" data-rail="designBanner" hidden data-i18n="banner.designSystem"></p>
        <p class="banner warn" data-rail="stalledBanner" hidden>
          <span data-rail="stalledText"></span>
          <button type="button" data-act="nudge" data-i18n="session.nudge"></button>
          <small data-i18n="session.stalledHint"></small>
        </p>
      </div>

      <div class="rail">
        <span class="pill" data-rail="status"></span>
        <span class="rail-detail" data-rail="detail" hidden>
          <span class="bit"><span class="k" data-i18n="rail.track"></span><span class="v" data-rail="track"></span></span>
          <span class="bit"><span class="k" data-i18n="rail.cycle"></span><span class="v" data-rail="cycle"></span></span>
          <span class="bit"><span class="k" data-i18n="rail.stage"></span><span class="v" data-rail="stage"></span></span>
          <span class="bit" data-rail="target"></span>
          <span class="bit" data-rail="run"></span>
          <span class="bit" data-rail="findings"></span>
          <span class="bit warnish" data-rail="strikesBit" hidden
            ><span class="k" data-i18n="rail.strikes"></span><span class="v" data-rail="strikes"></span
          ></span>
          <span class="bit" data-rail="gate"></span>
        </span>
        <!-- Halt and Stop, side by side and labelled distinctly. Conflating
             them is the obvious mistake: Stop kills the pty and leaves
             `state.json` saying `running` with no HALT.md, which is not a halt. -->
        <button type="button" class="danger" data-act="halt" data-rail="halt" hidden data-i18n="controls.halt"></button>
        <button type="button" data-act="stop" data-rail="stop" hidden data-i18n="controls.stop"></button>
      </div>
    </header>

    <nav class="tabs" data-i18n-label="tabs.label">
      <a id="tab-run" href="#run" aria-controls="panel-run" data-i18n="tabs.run"></a>
      <a id="tab-plans" href="#plans" aria-controls="panel-plans" data-i18n="tabs.plans"></a>
      <a id="tab-evidence" href="#evidence" aria-controls="panel-evidence" data-i18n="tabs.evidence"></a>
      <a id="tab-memory" href="#memory" aria-controls="panel-memory" data-i18n="tabs.memory"></a>
      <a id="tab-config" href="#config" aria-controls="panel-config" data-i18n="tabs.config"></a>
    </nav>

    <main>
      <section class="panel" id="panel-run" aria-labelledby="panel-run-title" hidden>
        <header class="panel-head">
          <div>
            <h1 id="panel-run-title" data-i18n="panel.run.title"></h1>
            <p class="hint" data-i18n="panel.run.help"></p>
          </div>
        </header>
        <p class="empty" id="run-empty"></p>

        <!-- The estimate, and the only thing on this page that describes a run
             nobody has started. It sits in the idle branch beside the empty
             line because that is the one moment it can still change a
             decision: the engine takes a track, not a state, for exactly this
             reason. -->
        <section class="block" id="run-preflight" hidden>
          <h2 data-i18n="preflight.title"></h2>
          <p class="hint" data-i18n="preflight.why"></p>
          <label class="picker">
            <span data-i18n="preflight.track"></span>
            <select id="preflight-track" name="track" data-i18n-label="preflight.track"></select>
          </label>
          <dl class="facts" id="preflight-facts"></dl>
          <p class="hint" id="preflight-basis"></p>
          <dl class="facts" id="preflight-past"></dl>
        </section>

        <div id="run-body" hidden>
          <dl class="facts">
            <div class="fact"><dt data-i18n="run.goal"></dt><dd id="run-goal"></dd></div>
            <div class="fact" id="run-story-fact"><dt data-i18n="run.story"></dt><dd id="run-story"></dd></div>
            <div class="fact" id="run-plan-fact"><dt data-i18n="run.plan"></dt><dd id="run-plan"></dd></div>
            <div class="fact" id="run-runid-fact"><dt data-i18n="run.runId"></dt><dd id="run-runid"></dd></div>
            <div class="fact"><dt data-i18n="run.findings"></dt><dd id="run-findings"></dd></div>
            <div class="fact" id="run-gate-fact"><dt data-i18n="run.gate"></dt><dd id="run-gate"></dd></div>
            <div class="fact" id="run-halt-fact"><dt data-i18n="run.halted"></dt><dd id="run-halt"></dd></div>
          </dl>

          <section class="block" id="run-roster" hidden>
            <h2 data-i18n="run.roster"></h2>
            <ul class="chips" id="run-roster-agents"></ul>
          </section>

          <section class="block" id="run-guards" hidden>
            <h2 data-i18n="run.guards"></h2>
            <p id="run-strikes"></p>
            <ul class="chips" id="run-cycle-errors"></ul>
          </section>

          <section class="block" id="run-findings-block" hidden>
            <h2 data-i18n="run.findingsTitle"></h2>
            <div class="scroller">
              <div class="grid grid-findings" role="table">
                <div class="grid-head" role="row">
                  <span role="columnheader" data-i18n="run.finding.severity"></span>
                  <span role="columnheader" data-i18n="run.finding.where"></span>
                  <span role="columnheader" data-i18n="run.finding.claim"></span>
                </div>
                <div id="run-findings-list" role="rowgroup" class="grid-body"></div>
              </div>
            </div>
          </section>

          <section class="block" id="run-gate-block" hidden>
            <h2 data-i18n="run.gatePanel"></h2>
            <p id="run-gate-state"></p>
            <p><code id="run-gate-ref"></code></p>
            <pre class="excerpt" id="run-gate-excerpt"></pre>
          </section>

          <section class="block" id="run-last" hidden>
            <h2 data-i18n="run.lastCycle"></h2>
            <p><span id="run-last-result"></span></p>
            <ul class="chips" id="run-last-agents"></ul>
          </section>

          <section class="block" id="run-timeline" hidden>
            <h2 data-i18n="run.timeline"></h2>
            <div class="scroller">
              <div class="grid grid-cycles" role="table">
                <div class="grid-head" role="row">
                  <span role="columnheader" data-i18n="run.cycle.number"></span>
                  <span role="columnheader" data-i18n="run.cycle.agents"></span>
                  <span role="columnheader" data-i18n="run.cycle.result"></span>
                  <span role="columnheader" data-i18n="run.cycle.ref"></span>
                </div>
                <div id="run-timeline-list" role="rowgroup" class="grid-body"></div>
              </div>
            </div>
          </section>

          <section class="block" id="run-haltreport" hidden>
            <h2 data-i18n="run.haltReport"></h2>
            <pre class="excerpt" id="run-halt-report"></pre>
          </section>
        </div>
      </section>

      <section class="panel" id="panel-plans" aria-labelledby="panel-plans-title" hidden>
        <header class="panel-head">
          <div>
            <h1 id="panel-plans-title" data-i18n="panel.plans.title"></h1>
            <p class="hint" data-i18n="panel.plans.help"></p>
          </div>
        </header>
        <p class="empty" id="plans-empty"></p>

        <section class="block" id="plans-ready" hidden>
          <h2 data-i18n="plans.readyNext"></h2>
          <ul class="chips" id="plans-ready-list"></ul>
        </section>

        <div class="plans-workspace" id="plans-workspace" data-detail-open="false">
          <div class="plans-master">
            <div class="plans" id="plans-list"></div>
            <p class="more" id="plans-more" hidden></p>
          </div>

          <section class="plan-detail block" id="plan-detail" hidden>
            <header class="plan-detail-head">
              <button type="button" class="plan-back" data-act="close-plan" data-i18n="plans.back"></button>
              <h2 id="plan-detail-title" tabindex="-1"></h2>
            </header>
            <p class="record" id="plan-approval-record"></p>

            <!-- The note is uncontrolled and written once at mount. A renderer
                 that assigned to it would eat what is being typed on the next
                 800ms tick. -->
            <div class="approve">
              <input
                id="approve-note"
                name="note"
                maxlength="2000"
                dir="auto"
                autocomplete="off"
                data-i18n-placeholder="plans.notePlaceholder"
                data-i18n-label="plans.noteLabel"
              />
              <button type="button" data-act="approve" data-i18n="plans.approve"></button>
              <button type="button" data-act="request-changes" data-i18n="plans.requestChanges"></button>
              <button type="button" class="danger" data-act="reject" data-i18n="plans.reject"></button>
            </div>

            <details id="plan-body-details">
              <summary data-i18n="plans.readPlan"></summary>
              <pre class="excerpt" id="plan-body"></pre>
            </details>
            <details id="plan-review-details" hidden>
              <summary data-i18n="plans.readReview"></summary>
              <pre class="excerpt" id="plan-review"></pre>
            </details>

            <ul class="stories detail" id="plan-detail-stories"></ul>
          </section>
        </div>

        <section class="block">
          <h2 data-i18n="plans.create"></h2>
          <!-- Both compose a loop command and enqueue it. Structured fields,
               one execution path: there is no second, weaker way to start work. -->
          <form class="command" data-act="new-plan">
            <input
              id="new-plan"
              name="idea"
              dir="auto"
              autocomplete="off"
              data-i18n-placeholder="plans.newPlanHint"
              data-i18n-label="plans.newPlanLabel"
            />
            <button type="submit" data-i18n="plans.newPlan"></button>
          </form>
        </section>
      </section>

      <section class="panel" id="panel-evidence" aria-labelledby="panel-evidence-title" hidden>
        <header class="panel-head">
          <div>
            <h1 id="panel-evidence-title" data-i18n="panel.evidence.title"></h1>
            <p class="hint" data-i18n="panel.evidence.help"></p>
          </div>
        </header>
        <p class="empty" id="evidence-empty"></p>
        <div class="scroller">
          <div class="grid grid-runs" role="table">
            <div class="grid-head" role="row">
              <span role="columnheader" data-i18n="evidence.run"></span>
              <span role="columnheader" data-i18n="evidence.story"></span>
              <span role="columnheader" data-i18n="evidence.track"></span>
              <span role="columnheader" data-i18n="evidence.cycles"></span>
              <span role="columnheader" data-i18n="evidence.outcome"></span>
              <span role="columnheader"></span>
            </div>
            <div id="evidence-list" role="rowgroup" class="grid-body"></div>
          </div>
        </div>
        <p class="more" id="evidence-more" hidden></p>

        <section class="block" id="run-open" hidden>
          <h2 id="run-open-title"></h2>
          <details id="run-open-halt" hidden>
            <summary data-i18n="evidence.haltReport"></summary>
            <pre class="excerpt" id="run-open-haltbody"></pre>
          </details>
          <div id="run-open-cycles"></div>
        </section>
      </section>

      <section class="panel" id="panel-memory" aria-labelledby="panel-memory-title" hidden>
        <header class="panel-head">
          <div>
            <h1 id="panel-memory-title" data-i18n="panel.memory.title"></h1>
            <p class="hint" data-i18n="panel.memory.help"></p>
          </div>
        </header>
        <p class="empty" id="memory-empty"></p>
        <div class="facets">
          <!-- Faceting is client-side because it has to be: `memorySearch`
               filters by none of kind, tag, time or run, so there is nothing to
               push to the server. -->
          <input
            id="memory-query"
            name="q"
            dir="auto"
            autocomplete="off"
            data-i18n-placeholder="memory.searchHint"
            data-i18n-label="memory.searchLabel"
          />
          <select id="memory-kind" name="kind" data-i18n-label="memory.kindLabel"></select>
        </div>
        <ul class="memories" id="memory-list"></ul>
        <p class="more" id="memory-more" hidden></p>
      </section>

      <section class="panel" id="panel-config" aria-labelledby="panel-config-title" hidden>
        <header class="panel-head">
          <div>
            <h1 id="panel-config-title" data-i18n="panel.config.title"></h1>
            <p class="hint" data-i18n="panel.config.help"></p>
          </div>
        </header>
        <dl class="facts">
          <div class="fact"><dt data-i18n="config.designSystem"></dt><dd id="config-design"></dd></div>
          <div class="fact"><dt data-i18n="config.project"></dt><dd id="config-project"></dd></div>
        </dl>

        <form class="config-editor" id="config-editor" data-act="config-save">
          <div class="config-editor-head">
            <div>
              <h2 data-i18n="config.editorTitle"></h2>
              <p class="hint" data-i18n="config.editorHelp"></p>
            </div>
            <div class="config-editor-actions">
              <button type="button" id="config-reset" data-act="config-reset" data-i18n="config.reset" disabled></button>
              <button type="submit" class="primary" id="config-save" data-i18n="config.save" disabled></button>
            </div>
          </div>
          <p class="banner warn" id="config-editor-state" hidden></p>

          <fieldset id="config-editor-fields">
            <legend data-i18n="config.behavior"></legend>
            <div class="config-fields">
              <label class="check-field">
                <input id="config-autonomous-input" name="autonomous" type="checkbox" data-i18n-label="config.autonomous" />
                <span data-i18n="config.autonomous"></span>
              </label>
              <label class="check-field">
                <input id="config-verify-cache-input" name="verify_cache" type="checkbox" data-i18n-label="config.verifyCache" />
                <span data-i18n="config.verifyCache"></span>
              </label>
              <label>
                <span data-i18n="config.maxParallel"></span>
                <input id="config-max-parallel-input" name="max_parallel_agents" type="number" min="1" step="1" required data-i18n-label="config.maxParallel" />
              </label>
              <label>
                <span data-i18n="config.strikes"></span>
                <input id="config-strikes-input" name="no_progress_strikes" type="number" min="1" step="1" required data-i18n-label="config.strikes" />
              </label>
              <label>
                <span data-i18n="config.planApproval"></span>
                <select id="config-plan-gate-input" name="plan_approval" data-i18n-label="config.planApproval">
                  <option value="human">human</option>
                  <option value="auto">auto</option>
                </select>
              </label>
              <label>
                <span data-i18n="config.commitGate"></span>
                <select id="config-commit-gate-input" name="commit" data-i18n-label="config.commitGate">
                  <option value="human">human</option>
                  <option value="auto">auto</option>
                </select>
              </label>
              <label>
                <span data-i18n="config.preflightGate"></span>
                <select id="config-preflight-gate-input" name="preflight" data-i18n-label="config.preflightGate">
                  <option value="human">human</option>
                  <option value="auto">auto</option>
                </select>
              </label>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="config.verify"></legend>
            <p class="hint" data-i18n="config.verifyWhy"></p>
            <div class="config-fields config-fields-wide">
              <label>
                <span>verify.test</span>
                <input id="config-test-input" name="verify_test" dir="ltr" autocomplete="off" data-i18n-label="config.verifyTestLabel" />
              </label>
              <label>
                <span>verify.lint</span>
                <input id="config-lint-input" name="verify_lint" dir="ltr" autocomplete="off" data-i18n-label="config.verifyLintLabel" />
              </label>
              <label>
                <span>verify.build</span>
                <input id="config-build-input" name="verify_build" dir="ltr" autocomplete="off" data-i18n-label="config.verifyBuildLabel" />
              </label>
              <label>
                <span>verify.timeout_ms</span>
                <input id="config-timeout-input" name="timeout_ms" type="number" min="1" step="1" required data-i18n-label="config.timeoutLabel" />
              </label>
              <label>
                <span>verify.lock_timeout_ms</span>
                <input id="config-lock-timeout-input" name="lock_timeout_ms" type="number" min="1" step="1" required data-i18n-label="config.lockTimeoutLabel" />
              </label>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="config.failurePatterns"></legend>
            <p class="hint" data-i18n="config.failurePatternsHelp"></p>
            <div class="config-fields config-fields-wide">
              <label>
                <span>verify.failure_patterns.test</span>
                <textarea id="config-patterns-test-input" name="patterns_test" rows="3" dir="ltr" data-i18n-label="config.patternsTestLabel"></textarea>
              </label>
              <label>
                <span>verify.failure_patterns.lint</span>
                <textarea id="config-patterns-lint-input" name="patterns_lint" rows="3" dir="ltr" data-i18n-label="config.patternsLintLabel"></textarea>
              </label>
              <label>
                <span>verify.failure_patterns.build</span>
                <textarea id="config-patterns-build-input" name="patterns_build" rows="3" dir="ltr" data-i18n-label="config.patternsBuildLabel"></textarea>
              </label>
            </div>
          </fieldset>

          <fieldset>
            <legend data-i18n="config.advancedTitle"></legend>
            <p class="hint" data-i18n="config.advancedHelp"></p>
            <div class="config-fields config-fields-wide">
              <label>
                <span>specialists</span>
                <textarea id="config-specialists-input" name="specialists_json" rows="8" dir="ltr" spellcheck="false" data-i18n-label="config.specialistsLabel"></textarea>
              </label>
              <label>
                <span>tracks</span>
                <textarea id="config-tracks-input" name="tracks_json" rows="12" dir="ltr" spellcheck="false" data-i18n-label="config.tracksLabel"></textarea>
              </label>
            </div>
          </fieldset>
        </form>

        <section class="block">
          <h2 data-i18n="config.currentVerify"></h2>
          <dl class="facts" id="config-verify"></dl>
        </section>

        <!-- Separate from the commands above, and not merely for reading ease:
             `verify:` also carries a timeout, a lock timeout and per-slot
             failure patterns, none of which is a command the engine runs. A
             list built from `Object.entries(verify)` put all three under the
             heading "Verify commands" — three lines claiming the engine
             executes a number. -->
        <section class="block">
          <h2 data-i18n="config.verifyPolicy"></h2>
          <p class="hint" data-i18n="config.verifyPolicyWhy"></p>
          <dl class="facts" id="config-verify-policy"></dl>
        </section>

        <section class="block">
          <h2 data-i18n="config.tracks"></h2>
          <div class="scroller">
            <div class="grid grid-tracks" role="table">
              <div class="grid-head" role="row">
                <span role="columnheader" data-i18n="config.track"></span>
                <span role="columnheader" data-i18n="config.required"></span>
                <span role="columnheader" data-i18n="config.available"></span>
                <span role="columnheader" data-i18n="config.maxCycles"></span>
                <span role="columnheader" data-i18n="config.gate"></span>
              </div>
              <div id="config-tracks" role="rowgroup" class="grid-body"></div>
            </div>
          </div>
        </section>

        <!-- What the specialists this project configures actually returned,
             which is the only form in which a `specialists:` map is worth
             reading: the mode is one column of it. A report and never a rule —
             nothing in the engine drafts or skips an agent because of a number
             here, and a specialist with no findings may be the reason the
             project has none. -->
        <section class="block" id="config-telemetry">
          <h2 data-i18n="telemetry.title"></h2>
          <p class="hint" data-i18n="telemetry.why"></p>
          <p class="empty" id="telemetry-empty" data-i18n="telemetry.empty" hidden></p>
          <p class="hint" id="telemetry-flagged" hidden></p>
          <div class="scroller" id="telemetry-table" hidden>
            <div class="grid grid-telemetry" role="table">
              <div class="grid-head" role="row">
                <span role="columnheader" data-i18n="telemetry.agent"></span>
                <span role="columnheader" data-i18n="telemetry.mode"></span>
                <span role="columnheader" data-i18n="telemetry.drafted"></span>
                <span role="columnheader" data-i18n="telemetry.skipped"></span>
                <span role="columnheader" data-i18n="telemetry.landed"></span>
                <span role="columnheader" data-i18n="telemetry.results"></span>
                <span role="columnheader" data-i18n="telemetry.findings"></span>
                <span role="columnheader" data-i18n="telemetry.runs"></span>
                <span role="columnheader" data-i18n="telemetry.lastRun"></span>
              </div>
              <div id="telemetry-list" role="rowgroup" class="grid-body"></div>
            </div>
          </div>
          <p class="more" id="telemetry-more" hidden></p>
        </section>

        <details id="config-raw-details">
          <summary data-i18n="config.raw"></summary>
          <pre class="excerpt" id="config-raw"></pre>
        </details>
      </section>
    </main>

    <section class="pane">
      <div class="pane-head">
        <button type="button" class="icon" data-act="pane-cycle" data-i18n-label="pane.toggle">▼</button>
        <button type="button" class="view-tab" id="view-session" data-act="view-session" data-i18n="terminal.title"></button>
        <button type="button" class="view-tab" id="view-queue" data-act="view-queue"></button>
        <span class="job-label" id="job-label"></span>
        <span class="viewing" id="job-viewing" hidden></span>
        <button type="button" class="icon" data-act="pane-full" data-i18n-label="pane.fullscreen">⤢</button>
        <button type="button" class="danger" data-act="stop" id="pane-stop" hidden data-i18n="controls.stop"></button>
      </div>

      <div class="pane-body">
        <div class="view" id="view-session-body">
          <p class="empty" id="terminal-empty" data-i18n="terminal.idle"></p>
          <!-- Pinned ltr whatever the ui language is: claude's output is box
               drawing and aligned columns, and mirroring it destroys both. -->
          <div class="terminal" id="terminal" dir="ltr"></div>
        </div>

        <div class="view" id="panel-queue" hidden>
          <p class="banner warn" id="queue-blocked" hidden data-i18n="queue.blockedBanner"></p>
          <p class="empty" id="queue-empty" data-i18n="queue.empty"></p>
          <ul class="jobs" id="queue-list"></ul>
          <p class="more" id="queue-more" hidden></p>
          <div class="queue-actions">
            <button type="button" id="queue-resume" data-act="resume" hidden data-i18n="queue.resume"></button>
            <button type="button" id="queue-clear" data-act="clear" hidden data-i18n="queue.clear"></button>
          </div>
        </div>
      </div>

      <form class="command" id="command-form" data-act="enqueue">
        <input
          id="command"
          name="command"
          list="command-suggestions"
          data-i18n-placeholder="command.placeholder"
          data-i18n-label="command.label"
          autocomplete="off"
          spellcheck="false"
          dir="auto"
        />
        <datalist id="command-suggestions"></datalist>
        <button type="submit" data-i18n="command.run"></button>
      </form>
      <small class="hint" data-i18n="command.hint"></small>
    </section>

    <!-- A native <dialog>: `showModal()` traps focus and handles Escape, which
         a hand-rolled overlay gets wrong in exactly the ways that matter. Its
         required field *is* the reason — a halt with no stated cause is the
         thing HALT.md exists to prevent. -->
    <dialog id="halt-dialog">
      <form method="dialog" data-act="halt-confirm" id="halt-form">
        <h2 data-i18n="halt.title"></h2>
        <p class="hint" data-i18n="halt.explain"></p>
        <label>
          <span data-i18n="halt.reason"></span>
          <input id="halt-reason" name="reason" required maxlength="2000" dir="auto" autocomplete="off" />
        </label>
        <div class="dialog-actions">
          <button type="button" data-act="halt-cancel" data-i18n="halt.cancel"></button>
          <button type="submit" class="danger" data-i18n="halt.confirm"></button>
        </div>
      </form>
    </dialog>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <!-- ── templates ───────────────────────────────────────────────────────
         Every repeatable row is cloned from here. Nothing on this page is
         built from a string, which is what makes `escape()` — and the XSS
         surface it existed to hold back — unnecessary rather than merely
         absent. -->

    <template id="tpl-toast">
      <div class="toast">
        <span data-slot="text"></span>
        <button type="button" data-act="toast-action" data-slot="action" hidden></button>
        <button type="button" class="icon" data-act="toast-dismiss" data-slot="dismiss">×</button>
      </div>
    </template>

    <template id="tpl-chip">
      <li class="chip"><span data-slot="text"></span></li>
    </template>

    <template id="tpl-plan">
      <article class="plan">
        <header class="plan-head">
          <span class="plan-id" data-slot="id"></span>
          <strong class="plan-title" data-slot="title"></strong>
          <span class="tag" data-slot="state"></span>
          <span class="tag" data-slot="approval"></span>
          <span class="count" data-slot="count"></span>
          <button type="button" data-act="open-plan" data-slot="open"></button>
        </header>
        <p class="empty" data-slot="empty" hidden></p>
        <ul class="stories" data-slot="stories"></ul>
      </article>
    </template>

    <template id="tpl-story">
      <li class="story">
        <span class="dot" data-slot="dot"></span>
        <span class="story-id" data-slot="id"></span>
        <span class="story-title" data-slot="title"></span>
        <span class="tag ui" data-slot="ui" hidden></span>
        <span class="story-status" data-slot="status"></span>
        <span class="waits" data-slot="waits" hidden></span>
        <button type="button" class="icon" data-act="build" data-slot="build">+</button>
      </li>
    </template>

    <template id="tpl-job">
      <li class="job">
        <span class="cmd" data-slot="command"></span>
        <span class="st" data-slot="status"></span>
        <span class="dur" data-slot="duration"></span>
        <span class="reason" data-slot="reason" hidden></span>
        <button type="button" class="icon" data-act="job-cancel" data-slot="cancel" hidden>×</button>
        <button type="button" class="icon" data-act="job-attach" data-slot="attach" hidden>↗</button>
      </li>
    </template>

    <template id="tpl-run">
      <div class="grid-row run" role="row">
        <span role="cell"><span class="run-id" data-slot="id"></span></span>
        <span role="cell" data-slot="story"></span>
        <span role="cell" data-slot="track"></span>
        <span role="cell" data-slot="cycles"></span>
        <span role="cell"><span class="res" data-slot="outcome"></span></span>
        <span role="cell"><button type="button" data-act="open-run" data-slot="open"></button></span>
      </div>
    </template>

    <!-- The verify table's own headings carry `data-slot` rather than
         `data-i18n`: `translateStatic` walks the document and
         `querySelectorAll` does not descend into `<template>` content, so a
         heading inside a cloned row can only be translated by the row's own
         `update()` — which is also what repaints it on a locale switch. -->
    <template id="tpl-run-cycle">
      <section class="cycle-block">
        <h3 data-slot="title"></h3>
        <ul class="chips" data-slot="roster"></ul>
        <ul class="skipped" data-slot="skipped"></ul>
        <ul class="agents" data-slot="agents"></ul>
        <section class="verify" data-slot="verifyBlock" hidden>
          <h4 data-slot="verifyTitle"></h4>
          <div class="scroller">
            <div class="grid grid-verify" role="table">
              <div class="grid-head" role="row">
                <span role="columnheader" data-slot="vh-slot"></span>
                <span role="columnheader" data-slot="vh-command"></span>
                <span role="columnheader" data-slot="vh-phase"></span>
                <span role="columnheader" data-slot="vh-exit"></span>
                <span role="columnheader" data-slot="vh-duration"></span>
                <span role="columnheader" data-slot="vh-source"></span>
                <span role="columnheader" data-slot="vh-drift"></span>
                <span role="columnheader" data-slot="vh-cached"></span>
              </div>
              <div class="grid-body" role="rowgroup" data-slot="verify"></div>
            </div>
          </div>
          <p class="more" data-slot="verifyMore" hidden></p>
        </section>
        <details data-slot="handoffDetails" hidden>
          <summary data-slot="handoffSummary"></summary>
          <pre class="excerpt" data-slot="handoff"></pre>
          <p class="more" data-slot="handoffCut" hidden></p>
        </details>
      </section>
    </template>

    <template id="tpl-verify-row">
      <div class="grid-row" role="row">
        <span role="cell"><code data-slot="slot"></code></span>
        <span role="cell"><code data-slot="command"></code></span>
        <span role="cell"><span class="phase" data-slot="phase"></span></span>
        <span role="cell"><span class="exit" data-slot="exit"></span></span>
        <span role="cell" data-slot="duration"></span>
        <span role="cell" data-slot="source"></span>
        <span role="cell"><code data-slot="drift"></code></span>
        <span role="cell" data-slot="cached"></span>
      </div>
    </template>

    <template id="tpl-skipped">
      <li><code data-slot="agent"></code> <span data-slot="reason"></span></li>
    </template>

    <template id="tpl-agent">
      <li class="agent">
        <code data-slot="name"></code>
        <span class="res" data-slot="status"></span>
        <span data-slot="summary"></span>
        <ul class="evidence-cards" data-slot="evidence"></ul>
        <code class="files" data-slot="files"></code>
      </li>
    </template>

    <template id="tpl-evidence-card">
      <li>
        <code data-slot="ref"></code>
        <pre class="excerpt" data-slot="excerpt"></pre>
      </li>
    </template>

    <template id="tpl-memory">
      <li class="memory">
        <code class="memory-id" data-slot="id"></code>
        <span class="tag" data-slot="kind"></span>
        <strong data-slot="title"></strong>
        <span class="when" data-slot="at"></span>
        <ul class="chips" data-slot="tags"></ul>
        <pre class="excerpt" data-slot="body"></pre>
      </li>
    </template>

    <!-- One row of a `<dl class="facts">`, wherever the rows are data rather
         than markup: a verify command, a policy key, one line of the preflight
         estimate. The label is a config key in some of those and a translated
         phrase in others, so it is a slot and never static text. -->
    <template id="tpl-fact">
      <div class="fact"><dt data-slot="label"></dt><dd data-slot="value"></dd></div>
    </template>

    <template id="tpl-specialist">
      <div class="grid-row" role="row">
        <span role="cell"><code data-slot="agent"></code></span>
        <span role="cell" data-slot="mode"></span>
        <span role="cell" data-slot="drafted"></span>
        <span role="cell" data-slot="skipped"></span>
        <span role="cell" data-slot="landed"></span>
        <span role="cell" data-slot="results"></span>
        <span role="cell" data-slot="findings"></span>
        <span role="cell" data-slot="runs"></span>
        <span role="cell"><code data-slot="lastRun"></code></span>
      </div>
    </template>

    <template id="tpl-track">
      <div class="grid-row" role="row">
        <span role="cell"><code data-slot="name"></code></span>
        <span role="cell" data-slot="required"></span>
        <span role="cell" data-slot="available"></span>
        <span role="cell" data-slot="max"></span>
        <span role="cell" data-slot="gate"></span>
      </div>
    </template>

    <template id="tpl-roster-agent">
      <li class="chip roster"><span data-slot="mark"></span><span data-slot="name"></span></li>
    </template>

    <template id="tpl-finding">
      <div class="grid-row finding" role="row">
        <span role="cell"><span class="sev" data-slot="severity"></span></span>
        <span role="cell"><code data-slot="where"></code></span>
        <span role="cell" data-slot="claim"></span>
      </div>
    </template>

    <template id="tpl-cycle">
      <div class="grid-row cycle" role="row">
        <span role="cell" data-slot="number"></span>
        <span role="cell" data-slot="agents"></span>
        <span role="cell"><span class="res" data-slot="result"></span></span>
        <span role="cell"><code data-slot="ref"></code></span>
      </div>
    </template>

    <template id="tpl-ready">
      <li class="chip ready">
        <span data-slot="id"></span>
        <button type="button" class="icon" data-act="build" data-slot="build">+</button>
      </li>
    </template>

    <template id="tpl-story-detail">
      <li class="story detail">
        <span class="story-id" data-slot="id"></span>
        <span class="story-title" data-slot="title"></span>
        <span class="story-status" data-slot="status"></span>
        <span class="waits anomaly" data-slot="anomaly" hidden></span>
        <button type="button" data-act="requeue" data-slot="requeue" hidden></button>
        <ul class="acceptance" data-slot="acceptance"></ul>
        <code class="evidence" data-slot="evidence" hidden></code>
      </li>
    </template>

    <template id="tpl-acceptance">
      <li data-slot="text"></li>
    </template>

    <template id="tpl-suggestion">
      <option data-slot="option"></option>
    </template>

    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
